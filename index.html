<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>OIOO</title>
<style>
:root{--bg:#fff;--text:#000;--muted:#8a8a8a;--line:#e5e5e5;--card:#f3f3f3;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#000;--text:#fff;--muted:#7d7d7d;--line:#262626;--card:#141414}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Segoe UI",Roboto,Tahoma,sans-serif}
body{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px calc(env(safe-area-inset-bottom,0px) + 96px)}
.hd{text-align:center;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;margin:6px 0 20px;direction:ltr}
.page{display:none}.page.on{display:block}
input,textarea,select,button{font:inherit;color:var(--text)}
.inp{width:100%;padding:12px 0;border:0;border-bottom:1px solid var(--text);background:none;font-size:16px;outline:none;margin-bottom:8px;border-radius:0}
.inp::placeholder{color:var(--muted)}
ul{list-style:none;margin:0;padding:0}
li.r{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.c{width:22px;height:22px;border:1.5px solid var(--text);border-radius:50%;flex:none;background:none;padding:0}
li.done .c{background:var(--text)}
.t{flex:1;font-size:16px;line-height:1.7;word-break:break-word;min-width:0}
li.done .t{color:var(--muted);text-decoration:line-through}
.ds{font-size:13px;color:var(--muted);line-height:1.6;margin-top:2px;word-break:break-word}
.b{border:0;background:none;color:var(--muted);font-size:16px;padding:6px;cursor:pointer}
.empty{color:var(--muted);text-align:center;padding:40px 0;font-size:14px}
.add{width:100%;border:1px dashed var(--muted);background:none;border-radius:12px;padding:12px;font-size:15px;margin-bottom:6px;cursor:pointer}
.dr{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.dr.past{opacity:.45}
.side{flex:none;text-align:right;direction:ltr}
.dt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.lf{font-size:12px;color:var(--muted);margin-top:2px}
.lf.hot{color:var(--text);font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.bar button{flex:1;border:0;background:none;color:var(--muted);padding:10px 0 9px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.bar button.on{color:var(--text)}
.bar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.sheet{width:100%;max-width:520px;background:var(--card);border-radius:20px 20px 0 0;padding:14px 20px calc(env(safe-area-inset-bottom,0px) + 20px)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--muted);margin:0 auto 14px;opacity:.6}
.lbl{font-size:12px;color:var(--muted);margin:10px 0 6px}
.sel{display:flex;gap:8px}
.sel select{flex:1;min-width:0;padding:10px 6px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:15px}
.pri{width:100%;margin-top:18px;border:0;border-radius:12px;padding:13px;background:var(--text);color:var(--bg);font-size:16px;cursor:pointer}
.err{color:var(--text);font-size:13px;min-height:18px;margin-top:6px}
.cn{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cn b{font-weight:500;font-size:17px}
.cn button{width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:none;font-size:18px;cursor:pointer}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;margin-bottom:14px}
.g .w{font-size:11px;color:var(--muted);padding:6px 0}
.g button{position:relative;border:0;background:none;aspect-ratio:1;border-radius:50%;font-size:15px;cursor:pointer;padding:0}
.g button.today{background:var(--text);color:var(--bg)}
.g button.sel{outline:1.5px solid var(--text);outline-offset:-1.5px}
.g button.has::after{content:"";position:absolute;left:50%;bottom:5px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}
.av{width:96px;height:96px;border-radius:50%;border:1px solid var(--muted);margin:10px auto 8px;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;background-size:cover;background-position:center;color:var(--muted)}
.av svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round}
.ch{text-align:center;font-size:13px;color:var(--muted);margin-bottom:24px}
</style>
</head>
<body>
<div class="hd" id="hd"></div>

<section class="page on" id="p-today">
<input class="inp" id="tin" dir="auto" placeholder="New task" enterkeyhint="done" autocomplete="off">
<ul id="tl"></ul>
</section>

<section class="page" id="p-dl">
<button class="add" id="addb">+ New deadline</button>
<ul id="dl"></ul>
</section>

<section class="page" id="p-cal">
<div class="cn"><button id="cp" aria-label="Previous month">&#8249;</button><b id="ct"></b><button id="cx" aria-label="Next month">&#8250;</button></div>
<div class="g" id="cg"></div>
<ul id="cl"></ul>
</section>

<section class="page" id="p-pro">
<div class="av" id="av"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg></div>
<div class="ch" id="chg">Change photo</div>
<input type="file" id="fi" accept="image/*" hidden>
<div class="lbl">Name</div>
<input class="inp" id="nm" dir="auto" placeholder="Your name" autocomplete="off">
</section>

<nav class="bar">
<button data-t="today" class="on"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>Today</button>
<button data-t="dl"><svg viewBox="0 0 24 24"><path d="M6 21V4"/><path d="M6 4h11l-2.5 4L17 12H6"/></svg>Deadlines</button>
<button data-t="cal"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Calendar</button>
<button data-t="pro"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg>Profile</button>
</nav>

<div class="ov" id="ov">
<div class="sheet">
<div class="grab"></div>
<input class="inp" id="dtl" dir="auto" placeholder="Title" autocomplete="off">
<input class="inp" id="dds" dir="auto" placeholder="Description (optional)" autocomplete="off">
<div class="lbl">Date (Jalali)</div>
<div class="sel"><select id="sy"></select><select id="sm"></select><select id="sd"></select></div>
<div class="err" id="er"></div>
<button class="pri" id="sv">Add deadline</button>
</div>
</div>

<script>
//J-START
var BR=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
function div(a,b){return ~~(a/b)}
function mod(a,b){return a-~~(a/b)*b}
function jalCal(jy){
  var bl=BR.length,gy=jy+621,leapJ=-14,jp=BR[0],jm,jump,leap,leapG,march,n,i;
  for(i=1;i<bl;i+=1){jm=BR[i];jump=jm-jp;if(jy<jm)break;leapJ=leapJ+div(jump,33)*8+div(mod(jump,33),4);jp=jm}
  n=jy-jp;
  leapJ=leapJ+div(n,33)*8+div(mod(n,33)+3,4);
  if(mod(jump,33)===4&&jump-n===4)leapJ+=1;
  leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150;
  march=20+leapJ-leapG;
  if(jump-n<6)n=n-jump+div(jump+4,33)*33;
  leap=mod(mod(n+1,33)-1,4);
  if(leap===-1)leap=4;
  return {leap:leap,gy:gy,march:march}
}
function g2d(gy,gm,gd){
  var d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;
  d=d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752;
  return d
}
function d2g(jdn){
  var j=4*jdn+139361631;
  j=j+div(div(4*jdn+183187720,146097)*3,4)*4-3908;
  var i=div(mod(j,1461),4)*5+308;
  var gd=div(mod(i,153),5)+1,gm=mod(div(i,153),12)+1,gy=div(j,1461)-100100+div(8-gm,6);
  return {gy:gy,gm:gm,gd:gd}
}
function j2d(jy,jm,jd){var r=jalCal(jy);return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1}
function d2j(jdn){
  var gy=d2g(jdn).gy,jy=gy-621,r=jalCal(jy),jdn1f=g2d(gy,3,r.march),jd,jm,k;
  k=jdn-jdn1f;
  if(k>=0){
    if(k<=185){jm=1+div(k,31);jd=mod(k,31)+1;return {jy:jy,jm:jm,jd:jd}}
    k-=186
  }else{jy-=1;k+=179;if(r.leap===1)k+=1}
  jm=7+div(k,30);jd=mod(k,30)+1;
  return {jy:jy,jm:jm,jd:jd}
}
function mlen(y,m){return m<=6?31:(m<=11?30:(jalCal(y).leap===0?30:29))}
//J-END
var $=function(i){return document.getElementById(i)};
function p2(n){return (n<10?"0":"")+n}
function jstr(y,m,d){return y+"-"+p2(m)+"-"+p2(d)}
function gKey(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function todayJdn(){var d=new Date();return g2d(d.getFullYear(),d.getMonth()+1,d.getDate())}
function gStr(){var d=new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
var MN=["Farvardin","Ordibehesht","Khordad","Tir","Mordad","Shahrivar","Mehr","Aban","Azar","Dey","Bahman","Esfand"];
function get(k,def){try{var v=JSON.parse(localStorage.getItem(k));return v==null?def:v}catch(e){return def}}
function put(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

var data=get("daily-tasks",{day:gKey(),tasks:[]});
if(!data||!data.tasks)data={day:gKey(),tasks:[]};
var dls=get("deadlines",[]);
var prof=get("profile",{name:"",photo:""});
var tab="today";

function header(){var j=d2j(todayJdn());$("hd").textContent="Today = ["+gStr()+" , "+jstr(j.jy,j.jm,j.jd)+"]"}
function checkDay(){
  if(data.day!==gKey()){data={day:gKey(),tasks:[]};put("daily-tasks",data)}
  header();renderAll()
}

function renderToday(){
  var ul=$("tl");ul.innerHTML="";var tasks=data.tasks;
  if(!tasks.length){ul.innerHTML='<div class="empty">Nothing yet</div>';return}
  tasks.forEach(function(t,i){
    var li=document.createElement("li");li.className="r"+(t.d?" done":"");
    li.innerHTML='<button class="c" aria-label="Done"></button><span class="t" dir="auto"></span><button class="b" data-a="up">\u2191</button><button class="b" data-a="dn">\u2193</button><button class="b" data-a="del">\u2715</button>';
    li.querySelector(".t").textContent=t.x;
    li.querySelector(".c").onclick=function(){t.d=!t.d;put("daily-tasks",data);renderToday()};
    li.querySelectorAll(".b").forEach(function(b){b.onclick=function(){
      var a=b.dataset.a;
      if(a==="del")tasks.splice(i,1);
      if(a==="up"&&i>0){var x=tasks[i];tasks[i]=tasks[i-1];tasks[i-1]=x}
      if(a==="dn"&&i<tasks.length-1){var y=tasks[i];tasks[i]=tasks[i+1];tasks[i+1]=y}
      put("daily-tasks",data);renderToday()}});
    ul.appendChild(li)
  })
}
$("tin").onkeydown=function(e){
  if(e.key==="Enter"){var s=this.value.trim();if(!s)return;checkDay();data.tasks.push({x:s,d:false});this.value="";put("daily-tasks",data);renderToday()}
};

function sortedDl(){
  var t=todayJdn();
  var arr=dls.map(function(d){return {d:d,n:j2d(d.y,d.m,d.dd)-t}});
  var up=arr.filter(function(a){return a.n>=0}).sort(function(a,b){return a.n-b.n});
  var pa=arr.filter(function(a){return a.n<0}).sort(function(a,b){return b.n-a.n});
  return up.concat(pa)
}
function leftTxt(n){
  if(n===0)return "Today";if(n===1)return "Tomorrow";if(n===-1)return "1 day ago";
  return n>0?n+" days left":(-n)+" days ago"
}
function renderDl(){
  var ul=$("dl");ul.innerHTML="";var arr=sortedDl();
  if(!arr.length){ul.innerHTML='<div class="empty">No deadlines</div>';return}
  arr.forEach(function(a){
    var d=a.d,li=document.createElement("li");li.className="dr"+(a.n<0?" past":"");
    li.innerHTML='<div class="t"><div class="tt" dir="auto"></div><div class="ds" dir="auto"></div></div><div class="side"><div class="dt"></div><div class="lf"></div></div><button class="b" aria-label="Delete">\u2715</button>';
    li.querySelector(".tt").textContent=d.t;
    var ds=li.querySelector(".ds");if(d.s)ds.textContent=d.s;else ds.style.display="none";
    li.querySelector(".dt").textContent=jstr(d.y,d.m,d.dd);
    var lf=li.querySelector(".lf");lf.textContent=leftTxt(a.n);if(a.n>=0&&a.n<=3)lf.className="lf hot";
    li.querySelector(".b").onclick=function(){
      if(!confirm("Delete this deadline?"))return;
      dls=dls.filter(function(x){return x.id!==d.id});put("deadlines",dls);renderDl();renderCal()
    };
    ul.appendChild(li)
  })
}

function fillYears(){
  var j=d2j(todayJdn()),sy=$("sy");sy.innerHTML="";
  for(var y=j.jy;y<=j.jy+4;y++){var o=document.createElement("option");o.value=y;o.textContent=y;sy.appendChild(o)}
  var sm=$("sm");sm.innerHTML="";
  for(var m=1;m<=12;m++){var o2=document.createElement("option");o2.value=m;o2.textContent=p2(m)+" \u00b7 "+MN[m-1];sm.appendChild(o2)}
  sy.value=j.jy;sm.value=j.jm;fillDays(j.jd)
}
function fillDays(keep){
  var sd=$("sd"),n=mlen(+$("sy").value,+$("sm").value),cur=keep||+sd.value||1;
  sd.innerHTML="";
  for(var d=1;d<=n;d++){var o=document.createElement("option");o.value=d;o.textContent=p2(d);sd.appendChild(o)}
  sd.value=Math.min(cur,n)
}
$("sy").onchange=function(){fillDays()};
$("sm").onchange=function(){fillDays()};
function openSheet(){$("dtl").value="";$("dds").value="";$("er").textContent="";fillYears();$("ov").classList.add("open")}
function closeSheet(){$("ov").classList.remove("open")}
$("addb").onclick=openSheet;
$("ov").onclick=function(e){if(e.target===this)closeSheet()};
$("dtl").oninput=function(){$("er").textContent=""};
$("sv").onclick=function(){
  var t=$("dtl").value.trim();
  if(!t){$("er").textContent="Enter a title first";return}
  dls.push({id:Date.now(),t:t,s:$("dds").value.trim(),y:+$("sy").value,m:+$("sm").value,dd:+$("sd").value});
  put("deadlines",dls);closeSheet();renderDl();renderCal()
};

var cy,cm,csel=null;
function initCal(){var j=d2j(todayJdn());cy=j.jy;cm=j.jm;csel=null}
function renderCal(){
  if(!cy)initCal();
  $("ct").textContent=MN[cm-1]+" "+cy;
  var g=$("cg");g.innerHTML="";
  ["Sat","Sun","Mon","Tue","Wed","Thu","Fri"].forEach(function(w){var e=document.createElement("div");e.className="w";e.textContent=w;g.appendChild(e)});
  var len=mlen(cy,cm),first=j2d(cy,cm,1),idx=((first%7)+2)%7,t=todayJdn();
  var has={};dls.forEach(function(d){if(d.y===cy&&d.m===cm)has[d.dd]=1});
  for(var i=0;i<idx;i++)g.appendChild(document.createElement("div"));
  for(var d=1;d<=len;d++)(function(d){
    var b=document.createElement("button");b.textContent=d;
    if(j2d(cy,cm,d)===t)b.className+=" today";
    if(has[d])b.className+=" has";
    if(csel===d)b.className+=" sel";
    b.onclick=function(){csel=(csel===d?null:d);renderCal()};
    g.appendChild(b)
  })(d);
  var ul=$("cl");ul.innerHTML="";
  var list=dls.filter(function(x){return x.y===cy&&x.m===cm&&(csel===null||x.dd===csel)}).sort(function(a,b){return a.dd-b.dd});
  if(!list.length){ul.innerHTML='<div class="empty">'+(csel?"No deadlines on this day":"No deadlines this month")+'</div>';return}
  list.forEach(function(d){
    var li=document.createElement("li");li.className="dr";
    li.innerHTML='<div class="t"><div class="tt" dir="auto"></div><div class="ds" dir="auto"></div></div><div class="side"><div class="dt"></div></div>';
    li.querySelector(".tt").textContent=d.t;
    var ds=li.querySelector(".ds");if(d.s)ds.textContent=d.s;else ds.style.display="none";
    li.querySelector(".dt").textContent=jstr(d.y,d.m,d.dd);
    ul.appendChild(li)
  })
}
$("cp").onclick=function(){cm--;if(cm<1){cm=12;cy--}csel=null;renderCal()};
$("cx").onclick=function(){cm++;if(cm>12){cm=1;cy++}csel=null;renderCal()};

function renderPro(){
  $("nm").value=prof.name||"";
  var a=$("av");
  if(prof.photo){a.style.backgroundImage="url("+prof.photo+")";a.innerHTML=""}
}
$("nm").oninput=function(){prof.name=this.value;put("profile",prof)};
$("av").onclick=$("chg").onclick=function(){$("fi").click()};
$("fi").onchange=function(){
  var f=this.files&&this.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    var im=new Image();
    im.onload=function(){
      var s=256,c=document.createElement("canvas");c.width=c.height=s;
      var m=Math.min(im.width,im.height),sx=(im.width-m)/2,sy=(im.height-m)/2;
      c.getContext("2d").drawImage(im,sx,sy,m,m,0,0,s,s);
      prof.photo=c.toDataURL("image/jpeg",0.8);put("profile",prof);renderPro()
    };
    im.src=r.result
  };
  r.readAsDataURL(f)
};

function renderAll(){renderToday();renderDl();renderCal();renderPro()}
function show(t){
  tab=t;
  ["today","dl","cal","pro"].forEach(function(n){$("p-"+n).classList.toggle("on",n===t)});
  document.querySelectorAll(".bar button").forEach(function(b){b.classList.toggle("on",b.dataset.t===t)});
  window.scrollTo(0,0)
}
document.querySelectorAll(".bar button").forEach(function(b){b.onclick=function(){show(b.dataset.t)}});
document.addEventListener("visibilitychange",function(){if(!document.hidden)checkDay()});
window.addEventListener("focus",checkDay);
checkDay();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
</script>
</body>
</html>
